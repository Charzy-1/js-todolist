<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo list with Javascript</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrapper">
    
    <h2>My Tasks</h2>
    <p class="today"></p>

    <div class="anchors">
      <a href="/" class="anchor-btn">All</a>
      <a href="/" class="anchor-btn">To DO</a>
      <a href="/" class="anchor-btn">Inprogress</a>
      <a href="/" class="anchor-btn">Done</a>
    </div>
    

    <!-- Todos contianer -->
    <div class="js-todos todos-grid"></div>
    
    <!-- Container holding the input and add button -->
    <div class="inputContainer">
      <input
        type="text"
        placeholder="Add a new task"
        class="inputBox name-input"
      >

      <button class="add-button" type="button" aria-label="Add task">
        +
      </button>
    </div>
</div>

<script type="module" src="/index.js"></script>

</body>
</html>
