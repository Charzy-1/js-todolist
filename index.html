<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo list with Javascript</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrapper">
    <h2>My Todo List</h2>

    <!-- CONTAINGER HOLDING THE INPUT AND ADD BUTTON -->

    <div class="inputContainer">
      <input type="text" placeholder="Todo name" class="inputBox name-input" onkeydown="
        renderTodoWithEnterKey(event)
      ">

      <input type="date" class="dateBox date-input">

      <button onclick="
        addButton()
      "  class="add-button">Add</button>
    </div>

    <div class="js-todos todos-grid"></div>
  </div>
  
  

  <script src="/index.js"></script>
</body>
</html>
